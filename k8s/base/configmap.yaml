#-----------------------------------------------------
# Runtime config for the GKE deployment.
#
#   -- Open Design --
#   Shared service settings live here instead of being hardcoded into pods.
#
#   -- Adaptability --
#   These values can be changed with kubectl without rebuilding the image.
#-----------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: csc258-config
  namespace: csc258
data:
  LOG_LEVEL: INFO
  KAFKA_BOOTSTRAP_SERVERS: broker:9093
  SOCIAL_POSTS_TOPIC: BlueSky_socialmedia_posts
  STORAGE_API_URL: http://storage:5001
  POSTS_LAP: "100"
  TOP_TERMS: "20"
  MAX_EXAMPLES_PER_TOPIC: "25"
  MAX_TRACKED_TOPICS: "500"
  SOURCE_NAME: bluesky
  JETSTREAM_INDEX: "3"
  RECONNECT_DELAY_SECONDS: "5"
  MAX_RECONNECT_DELAY_SECONDS: "60"
  RECONNECT_BACKOFF_MULTIPLIER: "2"
  MAX_RECONNECT_ATTEMPTS_BEFORE_SWITCH: "4"
---
# dashboard config is separate because it is loaded by the browser
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: csc258
data:
  # replace this placeholder with the storage LoadBalancer IP after deploy
  config.js: |
    window.DASHBOARD_API_BASE_URL = window.DASHBOARD_API_BASE_URL || "http://REPLACE_WITH_STORAGE_EXTERNAL_IP:5001";
