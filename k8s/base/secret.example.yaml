#-----------------------------------------------------
# Example Kubernetes Secret for PostgreSQL.
#
#   -- Security --
#   Replace the placeholder password before deploying.
#   Do not commit a real password in this file.
#-----------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: csc258
type: Opaque
stringData:
  # database name and user used by the storage service
  POSTGRES_DB: trends_db
  POSTGRES_USER: trend_user
  # change this value before applying to a real GKE cluster
  POSTGRES_PASSWORD: change-me-before-deploying
  DATABASE_URL: postgresql://trend_user:change-me-before-deploying@postgres:5432/trends_db
